[package]
name = "mddplayer"
version = "1.6.2"
edition = "2024"
authors = ["Xa1st <xux851@gmail.com>"]
description = "一个简易的音乐播放器,用于在命令行内播放音乐，支持 mp3/flac/ogg/aac(m4a)/wav 格式的音频文件。"

[dependencies]
# 音频播放库
# 关闭默认特性（默认的 flac/vorbis 由 claxon/lewton 解码，与 symphonia 重复）：
# - MP3/FLAC/OGG/AAC(M4A) 统一走 symphonia 一套后端
# - WAV 保留 hound 后端：rodio 的 symphonia-wav 特性会硬性捆绑 ADPCM 编解码器，
#   与「移除 ADPCM」冲突，且 hound 可直接给出 WAV 总时长
# 另外：rodio 0.17 的 AAC/MP4 解码是独立特性（默认不启用），不显式开启的话
# AAC/M4A 文件会直接报"解码失败"，这里必须显式列出。
rodio = { version = "0.17", default-features = false, features = [
    "wav",              # WAV 走 hound 后端
    "symphonia-mp3",
    "symphonia-flac",
    "symphonia-vorbis",
    "symphonia-aac",    # AAC 解码（.aac / .m4a）
    "symphonia-isomp4", # MP4 容器支持（.m4a）
] }
# 命令行参数解析
clap = { version = "4.4", features = ["derive"] }
# 命令行交互
crossterm = "0.27"
# MP3/FLAC 等标签读取
# id3 = "1.16" 
# 移除id3，使用lofty来替代，因为要支持的不只只有mp3
lofty = { version = "0.22" }
# 可靠解码和获取总时长 (Symphonia)
# 关闭默认特性（默认不含 mp3/aac/isomp4，且会拉入 mkv 等用不到的格式），
# 显式列出实际支持的格式。不含 wav/pcm/adpcm：WAV 由 rodio 的 hound 后端负责
# （时长也由它直接提供），symphonia 不再参与 WAV。特性会与 rodio 的
# symphonia-* 特性自动合并（Cargo 特性统一，两边取并集）。
symphonia = { version = "0.5.5", default-features = false, features = [
    "mp3", "flac", "ogg", "vorbis", "aac", "isomp4",
] }
# 随机数
rand = "0.8"
# 用于计划符串宽度
unicode-width = "0.2"
# 获取文件列表
glob = "0.3"

# 可选：如果怀疑内存碎片化严重，可以添加 jemallocator
#jemallocator = "0.5" 
#[target.'cfg(not(target_env = "msvc"))'.dependencies]
#jemallocator = "0.5"

[profile.release]
# 级别 3 是最激进的优化，生成最小的二进制文件
opt-level = 3 
# 启用链接时优化 (最重要的一步)
lto = true
# 禁用调试符号（默认 release 模式下是禁用的，但最好明确设置）
debug = false
# 优化生成的可执行文件的大小（尝试使用 z 或 s）
codegen-units = 1 
# 移除所有符号表信息，进一步减小体积
strip = "symbols"


# 【重点：添加 build-dependencies】
[build-dependencies]
winres = "0.1" # 这是一个流行的、成熟的 crate
